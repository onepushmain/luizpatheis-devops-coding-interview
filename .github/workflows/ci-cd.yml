# CI/CD for the SecureFlight API.
#   PR -> main   : test -> build (image + chart validated locally, no cloud access)
#   push -> main : test -> build -> publish (Artifact Registry) -> deploy (Helm to GKE)
# See docs/ci-cd.md for secrets, variables and prerequisites.
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Only publish/deploy (main only) request id-token: write.
permissions:
  contents: read

# bash -eo pipefail: a failing command inside a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-cd-${{ github.ref }}
  # Supersede stale PR runs; never cancel a main run mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: secureflight-api
  HELM_RELEASE: secureflight-api
  CHART_PATH: deploy/helm/secureflight-api
  HELM_VERSION: v3.22.1

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # api/main.py imports "flights.router" without the "api." prefix.
      PYTHONPATH: api
      # Required by Settings(); tests use mongomock, so no real database is hit.
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB_NAME: flights_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --requirement requirements.txt

      - name: Run tests
        run: python -m pytest --junitxml=test-results/junit.xml -v

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  # Runs on PRs and main. Never has cloud credentials.
  build:
    name: Build
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LOCAL_IMAGE: secureflight-api:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint and render Helm chart
        run: |
          helm lint "$CHART_PATH" --strict --set image.tag="$GITHUB_SHA"
          helm template "$HELM_RELEASE" "$CHART_PATH" --set image.tag="$GITHUB_SHA" > /dev/null
          # Also render the NetworkPolicy path the way deploy enables it.
          helm template "$HELM_RELEASE" "$CHART_PATH" --set image.tag="$GITHUB_SHA" \
            --set networkPolicy.enabled=true \
            --set-json 'networkPolicy.mongoEgressTo=[{"ipBlock":{"cidr":"10.0.0.0/24"}}]' > /dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --detach --name smoke --publish 8000:8000 --read-only --tmpfs /tmp \
            --env MONGO_URI=mongodb://localhost:27017 --env MONGO_DB_NAME=smoke \
            "$LOCAL_IMAGE"
          for _ in $(seq 1 15); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/ || true)
            if [ "$code" = "204" ]; then echo "Liveness OK (204)"; exit 0; fi
            sleep 2
          done
          echo "::error::Container did not answer GET / with 204"
          docker logs smoke
          exit 1

  # main only: rebuild from the warm cache and push with SBOM + provenance.
  publish:
    name: Publish image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    outputs:
      repository: ${{ steps.meta.outputs.repository }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image repository
        id: meta
        env:
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}
        run: echo "repository=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Log in to Artifact Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

  deploy:
    name: Deploy to GKE
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    # Shared with rollback.yml so a deploy and a rollback never run at the same time.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      REPOSITORY: ${{ needs.publish.outputs.repository }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      # Optional. CIDR of the Mongo host, an output of the IaC layer. When set,
      # the chart's NetworkPolicy is enabled and egress is limited to it.
      MONGO_EGRESS_CIDR: ${{ vars.MONGO_EGRESS_CIDR }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          # Reach a private control plane from GitHub-hosted runners without a bastion.
          use_dns_based_endpoint: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Check release is not stuck
        # A cancelled run can leave the release in pending-*; fail with a clear message.
        run: |
          status=$(helm status "$HELM_RELEASE" --namespace "$NAMESPACE" -o json 2>/dev/null | jq -r '.info.status' || true)
          echo "Current release status: ${status:-<not installed>}"
          case "$status" in
            pending-*)
              echo "::error::Release is '$status'. Run the rollback workflow (or 'helm rollback') to clear it, then re-run."
              exit 1 ;;
          esac

      - name: Helm upgrade
        # --atomic implies --wait: if pods do not become ready, Helm rolls back automatically.
        run: |
          np_args=()
          if [ -n "$MONGO_EGRESS_CIDR" ]; then
            np_args=(--set networkPolicy.enabled=true
                     --set-json "networkPolicy.mongoEgressTo=[{\"ipBlock\":{\"cidr\":\"${MONGO_EGRESS_CIDR}\"}}]")
          fi
          helm upgrade "$HELM_RELEASE" "$CHART_PATH" \
            --install \
            --namespace "$NAMESPACE" \
            --set image.repository="$REPOSITORY" \
            --set image.tag="$GITHUB_SHA" \
            --set image.digest="$DIGEST" \
            "${np_args[@]}" \
            --description "sha=${GITHUB_SHA::7} digest=${DIGEST::19}" \
            --atomic \
            --timeout 5m \
            --history-max 10

      - name: Post-deploy smoke test (API -> Mongo)
        id: smoke
        # The pod probes only hit GET /, which never touches Mongo. This proves the DB path.
        run: |
          kubectl run "smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --namespace "$NAMESPACE" \
            --image=curlimages/curl:8.11.1 --restart=Never --rm --attach --quiet \
            --labels=app.kubernetes.io/name=secureflight-smoke \
            --command -- curl --fail --silent --show-error --max-time 10 \
            "http://${HELM_RELEASE}.${NAMESPACE}.svc.cluster.local/flights?limit=1"

      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          revision=$(helm status "$HELM_RELEASE" --namespace "$NAMESPACE" -o json | jq -r '.version')
          if ! [[ "$revision" =~ ^[0-9]+$ ]]; then
            echo "::error::Smoke test failed and the release revision could not be read; roll back manually."
            exit 1
          fi
          if [ "$revision" -gt 1 ]; then
            helm rollback "$HELM_RELEASE" --namespace "$NAMESPACE" --wait --timeout 5m
            echo "::error::Smoke test failed; rolled back from revision $revision."
          else
            echo "::error::Smoke test failed on first install; nothing to roll back to."
          fi

      - name: Deployment summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Deploy to GKE"
            echo "- Image: \`${REPOSITORY}@${DIGEST}\` (commit \`${GITHUB_SHA::7}\`)"
            echo "- Release: \`$HELM_RELEASE\` in namespace \`$NAMESPACE\`"
            echo
            echo '```'
            helm history "$HELM_RELEASE" --namespace "$NAMESPACE" --max 5 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
